# Fly.io configuration for Whetstone.
#
# Rename "whetstone" below to your own app name; Fly app names are globally
# unique. Then follow DEPLOY.md.

app = "whetstone"
primary_region = "iad"   # change to the region nearest your users

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  DATABASE_PATH = "/data/whetstone.db"
  BACKUP_DIR = "/data/backups"
  # Fly terminates TLS at its proxy and forwards the real client IP in
  # X-Forwarded-For, so rate limiting needs to read that header.
  TRUST_PROXY = "1"

# The SQLite file must live on a persistent volume. Without this, every deploy
# starts from an empty database and all user accounts and progress are lost.
[[mounts]]
  source = "whetstone_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  # Keep one machine running so the first visitor does not wait for a cold
  # start. Set to 0 to save money at the cost of a slow first request.
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/api/health"

# A single shared-CPU machine with 256MB comfortably serves early traffic.
# SQLite means you scale UP (bigger machine) rather than OUT (more machines):
# multiple machines would each have their own separate database file.
[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
  cpus = 1
