# Render Blueprint. Render reads this automatically when you connect the repo,
# so there is nothing to configure by hand in the dashboard.
#
# KNOWN LIMIT OF THE FREE PLAN: there is no persistent disk. DATABASE_PATH
# points at /tmp, which Render wipes on every redeploy and on every wake from
# sleep. Accounts and progress do not survive. That is acceptable for a short
# friend test and not acceptable for real users. To make data persist, move to
# a paid plan with a disk, or deploy on Fly.io using the fly.toml in this repo.

services:
  - type: web
    name: whetstone
    runtime: docker

    # ------------------------------------------------------------------
    # ACCOUNTS DO NOT SURVIVE ON THE FREE PLAN.
    #
    # Free instances get no persistent disk, so DATABASE_PATH below points
    # at /tmp, which Render wipes on every deploy AND every wake from
    # sleep. Every account and all progress is destroyed each time.
    #
    # TO FIX (this starts billing you, so it is left for you to do):
    #   1. change  plan: free   to   plan: starter
    #   2. uncomment the `disk:` block below
    #   3. change DATABASE_PATH to /data/whetstone.db
    #      and BACKUP_DIR to /data/backups
    #   4. commit, push, and let Render redeploy
    #
    # Then VERIFY: make an account, redeploy, and log in again.
    # ------------------------------------------------------------------
    plan: free

    # disk:
    #   name: whetstone-data
    #   mountPath: /data
    #   sizeGB: 1

    dockerfilePath: ./Dockerfile
    region: oregon

    # Render restarts the service if this endpoint stops returning 200.
    healthCheckPath: /api/health

    envVars:
      - key: NODE_ENV
        value: production


      # TEMPORARY. /tmp is wiped on every deploy and every sleep, so accounts
      # do not survive. Change both of these to /data once the disk above is
      # enabled. scripts/launch-check.js treats a /tmp database as a blocker.
      - key: DATABASE_PATH
        value: /tmp/whetstone.db

      - key: BACKUP_DIR
        value: /tmp/backups

      # Behind Render's proxy, rate limiting must read the forwarded client IP
      # or one abusive user throttles everybody.
      - key: TRUST_PROXY
        value: "1"

      # Signs session cookies. Render generates a strong random value and keeps
      # it out of the repo. Never hardcode this.
      - key: SESSION_SECRET
        generateValue: true

      # Used to build absolute links in emails. Render fills in the live URL.
      - key: PUBLIC_URL
        fromService:
          type: web
          name: whetstone
          envVarKey: RENDER_EXTERNAL_URL
