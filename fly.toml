# Fly.io configuration for Keen.
#
# IMPORTANT: Fly app names are globally unique across every Fly customer, so
# "keen" is certainly taken. `fly launch` will offer you a name; whatever you
# accept must be written here, or later `fly deploy` runs will target the wrong
# app or fail outright. LAUNCH.md walks through this.

app = "keen-study"
primary_region = "sjc"   # San Jose. Nearest region to California.

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  DATABASE_PATH = "/data/keen.db"
  BACKUP_DIR = "/data/backups"
  # Fly terminates TLS at its proxy and forwards the real client IP in
  # X-Forwarded-For, so rate limiting needs to read that header.
  TRUST_PROXY = "1"

# The SQLite file must live on a persistent volume. Without this, every deploy
# starts from an empty database and all user accounts and progress are lost.
[[mounts]]
  source = "keen_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  # Keep one machine running so the first visitor does not wait for a cold
  # start. Set to 0 to save money at the cost of a slow first request.
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/api/health"

# A single shared-CPU machine. SQLite means you scale UP (a bigger machine)
# rather than OUT (more machines): two machines would each end up with their
# own separate database file and users would see different data depending on
# which one answered.
#
# 512MB, not 256MB. The question bank is 25,348 rows and the process sits
# around 156MB resident with a few users on it. 256MB leaves almost no headroom,
# and the failure mode is not a slow app, it is the kernel OOM-killing Node
# mid-request. The difference is roughly a dollar a month.
[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  cpus = 1
